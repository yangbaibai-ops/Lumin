<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Lumin</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: file: lumin-file:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' data:"
    />
    <!--
      ⚠️ 这里原来有一段**纯 HTML/CSS 的首帧骨架屏**（`.lm-boot`：假顶栏 + 假侧栏 + 假正文 +
      居中的「LUMIN」呼吸字（心跳 keyframes `lm-breathe`）。它在 window 第一帧就可见，
      直到 Vue 挂载才被替换 —— 也就是用户看到的「启动遮罩层 + 骨架图 + 入场动画」。
      现已**整段删除**（用户口径：和 Typora 一样，打开就正常显示，不要遮罩/骨架/进场动画）。
      窗口从 `ready-to-show` 起只有主进程设定的纸色背景（`themeBackground()`），随后直接是界面。
      别再往这里加首帧骨架：那类遮罩会让「打开应用」多一层过场，而且多一次整窗绘制。
    -->
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
