<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Lumin</title>
    <!--
      CSP：**唯一真相源在 src/shared/csp.ts**，构建期由 electron.vite.config.ts 的插件把下面
      这个占位注释替换成真的 <meta http-equiv="Content-Security-Policy">（dev / prod 各一份）。
      为什么不再手写在这里：此前这里是**第二份** CSP，而且与主进程那份不一致
      （少 `lumin-file:` 与 `media-src`、多 `ws:`）—— "哪份生效"取决于 webRequest 对 file:// 的
      行为，两份不一致时安全边界根本说不清。守卫测试断言此处不再出现硬编码 CSP。
    -->
    <!--LUMIN_CSP-->
    <!--
      ⚠️ 这里原来有一段**纯 HTML/CSS 的首帧骨架屏**（`.lm-boot`：假顶栏 + 假侧栏 + 假正文 +
      居中的「LUMIN」呼吸字（心跳 keyframes `lm-breathe`）。它在 window 第一帧就可见，
      直到 Vue 挂载才被替换 —— 也就是用户看到的「启动遮罩层 + 骨架图 + 入场动画」。
      现已**整段删除**（用户口径：和 Typora 一样，打开就正常显示，不要遮罩/骨架/进场动画）。
      窗口从 `ready-to-show` 起只有主进程设定的纸色背景（`themeBackground()`），随后直接是界面。
      别再往这里加首帧骨架：那类遮罩会让「打开应用」多一层过场，而且多一次整窗绘制。
    -->
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
