<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Lumin</title>
    <!--
      CSP：**唯一真相源在 src/shared/csp.ts**，构建期由 electron.vite.config.ts 的插件把下面
      这个占位注释替换成真的 <meta http-equiv="Content-Security-Policy">（dev / prod 各一份）。
      为什么不再手写在这里：此前这里是**第二份** CSP，而且与主进程那份不一致
      （少 `lumin-file:` 与 `media-src`、多 `ws:`）—— "哪份生效"取决于 webRequest 对 file:// 的
      行为，两份不一致时安全边界根本说不清。守卫测试断言此处不再出现硬编码 CSP。
    -->
    <!--LUMIN_CSP-->
    <!--
      ─── 启动骨架（#boot-splash）：纯 HTML + 内联 CSS，**不依赖 JS bundle** ───────────────
      为什么在这里：窗口 `show()` 发生在渲染层首帧之前，而 body 的默认画布是**白色**。
      之前的版本只在主进程设了 `backgroundColor`，但页面一旦开始绘制，白色画布会盖住窗口底色
      —— 用户看到的就是「打开后白屏 5–6s」。这段内联样式让首帧从**第一字节**起就是纸色
      （--boot-paper = --paper 的浅色值，见 src/shared/theme.ts），并立即画出品牌 + 应用名 +
      细进度条，所以慢机器上看到的是 Lumin，而不是白屏。

      纪律：
        * 只放 HTML/CSS，**不放 <script>**（CSP 也不允许内联脚本）；移除逻辑在 main.ts 的
          lib/bootSplash.ts，用双 rAF + document.fonts.ready 判首帧，1500ms 兜底强制移除。
        * `aria-hidden="true"` + `pointer-events:none`：不进无障碍树、不拦截焦点/点击。
        * 动效只用 transform / opacity（GPU 合成，不触发布局）。
        * 图标是 resources/icon.png 的 128×128 内嵌 data URI（`node tools/sync-app-icon.js` 同步；
          单元测试比对 src/renderer/src/assets/iconPng.ts）。
      别再把它写成「假顶栏 + 假侧栏」那种整窗骨架：这里只是启动遮罩，Vue 首帧后 200ms 淡出。
    -->
    <style>
      :root {
        --boot-paper: #fbfaf6;
        --boot-ink: #20242b;
        --boot-muted: #7d8595;
        --boot-track: rgba(32, 36, 43, 0.1);
        --boot-bar: #6b7280;
      }

      /* 深色系统（主题默认 auto）在 JS 尚未跑起来时先按系统偏好上色；
         显式主题由 theme.css 的 .theme-* 覆盖（那份 CSS 一到位就接管）。 */
      @media (prefers-color-scheme: dark) {
        :root {
          --boot-paper: #35383d;
          --boot-ink: #e6e8ec;
          --boot-muted: #949aa6;
          --boot-track: rgba(255, 255, 255, 0.14);
          --boot-bar: #9aa0aa;
        }
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-paper);
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--boot-paper);
        color: var(--boot-ink);
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        /* 不拦截焦点/点击：骨架只是画面，不是交互层 */
        pointer-events: none;
        opacity: 1;
        transition: opacity 200ms ease;
        contain: layout style paint;
        will-change: opacity;
      }

      #boot-splash[data-state='hidden'] {
        opacity: 0;
      }

      /* 纯 CSS 兜底：JS bundle 完全没跑起来（解析失败/被拦）时，从**首帧**起算 1500ms
         也要自己让开，不能永远挡住。JS 一接管就写 html[data-boot-js='1'] 取消它
         （见 src/renderer/src/main.ts），之后由 bootSplash.ts 按首帧 + 兜底时限移除。 */
      #boot-splash {
        animation: boot-failsafe 1ms linear 1500ms forwards;
      }

      @keyframes boot-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      html[data-boot-js='1'] #boot-splash {
        animation: none;
      }

      #boot-splash .boot-emblem {
        width: 64px;
        height: 64px;
        border-radius: 15px;
        overflow: hidden;
        box-shadow:
          0 1px 2px rgba(16, 24, 40, 0.06),
          0 8px 28px rgba(16, 24, 40, 0.1);
      }

      #boot-splash .boot-emblem img {
        display: block;
        width: 64px;
        height: 64px;
        user-select: none;
        -webkit-user-drag: none;
      }

      #boot-splash .boot-name {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.24em;
        /* 字距把最后一个字母也推开了，补回来让视觉居中 */
        margin-left: 0.24em;
        color: var(--boot-ink);
      }

      #boot-splash .boot-track {
        width: 168px;
        height: 2px;
        border-radius: 2px;
        background: var(--boot-track);
        overflow: hidden;
      }

      #boot-splash .boot-bar {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: var(--boot-bar);
        transform: translate3d(-110%, 0, 0);
        animation: boot-slide 1100ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes boot-slide {
        to {
          transform: translate3d(360%, 0, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none;
        }
        /* 只关进度条动画；**不关** #boot-splash 的 1500ms 兜底（那不是动效，是保险） */
        #boot-splash .boot-bar {
          width: 100%;
          opacity: 0.55;
          transform: none;
          animation: none;
        }
      }
    </style>
  </head>
