# ─── 发版：推送 v* tag 时构建 Windows 安装包并创建 GitHub Release ───────────────
#
# 触发：`git tag v1.0.0 && git push origin v1.0.0`
# 产物：dist/Lumin-<version>-setup.exe、dist/latest.yml、dist/*.blockmap
#
# 门禁（审计 P1-4）：tag 与 package.json 的 version 必须一致，且先跑 `npm run ci`
# （typecheck/lint/单测/许可声明/文档数字/生产构建）再打包；任何一步红都不发版。
#
# 认证：只用仓库自带的 GITHUB_TOKEN（permissions.contents: write），
# 不配置任何签名证书 / PAT / 第三方 secret。安装包未做代码签名，
# 用户下载时会看到 SmartScreen 的“未知发布者”，这是已知限制（见 README）。
name: Release

on:
  push:
    tags:
      - 'v*'

# 创建 Release 需要写 contents；不要给多余权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # 与 ci.yml / package.yml 一致：action 一律 pin 到 commit SHA，
      # 注释保留人类可读的版本号（由 dependabot 的 github-actions 条目更新）。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # ─── 发版门禁（审计 P1-4）──────────────────────────────────────────────
      # 1) tag 必须与 package.json 的 version 一致：打错 tag 再也发不出「版本号不符」的包；
      # 2) `npm run ci` = typecheck + lint + 单测 + 许可声明/文档数字/令牌 + 生产构建，
      #    与 PR 门禁是同一份脚本（唯一真相源在 package.json），不在 release 里另抄一遍。
      - name: 校验 tag 与 package.json 版本一致
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag -or -not $tag.StartsWith('v')) {
            throw "发版 tag 必须形如 v1.2.3（当前 GITHUB_REF_NAME=「$tag」）；请用 git tag v<version> 重新打标签。"
          }
          $tagVersion = $tag.Substring(1)
          # 用 node 读版本号：PowerShell 的 ConvertFrom-Json 在 Windows PowerShell 5.1 下
          # 按 ANSI 解码无 BOM 的 UTF-8 package.json（description 里的中文会直接解析失败）。
          $pkgVersion = (node -p "require('./package.json').version").Trim()
          if ($tagVersion -ne $pkgVersion) {
            throw "tag（$tag → $tagVersion）与 package.json 的 version（$pkgVersion）不一致：先把 package.json 的 version 改成 $tagVersion（并同步 CHANGELOG 标题）再打 tag，否则拒绝发版。"
          }
          Write-Host "版本一致性通过：tag=$tag, package.json=$pkgVersion"

      - name: 门禁（与 CI 同一套：typecheck / lint / test / notices / docs / build）
        run: npm run ci

      - name: 构建 Windows 安装包
        run: npm run build:win

      - name: 校验产物存在
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'Lumin-*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw '没有找到 dist/Lumin-*-setup.exe' }
          if (-not (Test-Path 'dist/latest.yml')) { throw '没有找到 dist/latest.yml' }
          Get-ChildItem dist -Include *.exe, latest.yml, *.blockmap -Recurse |
            ForEach-Object { "$($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" } |
            Tee-Object -FilePath dist\SHA256SUMS.txt

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/Lumin-*-setup.exe
            dist/latest.yml
            dist/*.blockmap
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
