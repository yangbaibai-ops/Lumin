# ─── CI：类型 / 风格 / 单元测试 / 构建 ─────────────────────────────────────────
#
# 为什么只有这些、不含 CDP 套件：`tools/_verify-*.js` 需要**真实桌面会话**（窗口焦点、
# 单实例锁、真实按键），在无头 runner 上跑不稳。那部分留在本地按需跑（跑法见 README 与
# 各套件文件头），另有一条**不阻塞 PR** 的夜间 job：`.github/workflows/cdp.yml`。
#
# 门禁口径（本地 `npm run ci` 与这里一致；`ci` 脚本是唯一真相源，改动请同步两边）：
#   npm run typecheck        双工程（tsc + vue-tsc）
#   npm run lint             ESLint flat config，0 error / 0 warning（阈值写在 lint 脚本里，
#                            两侧不靠命令行参数对齐 —— 原来这里写 `-- --max-warnings 0`，
#                            而本地脚本没写，于是"完全一致"只是注释里的一句话）
#   npm run test:unit        node --test（纯逻辑，毫秒级）
#   npm run notices:check    第三方许可声明与 lockfile 对账（审计 §5）
#   npm run docs:facts:check 文档里的数字/路径与实测一致（审计 §10）
#   npm run docs:tokens:check设计令牌文档与 theme.css 一致
#   electron-vite build      生产构建
#
# ⚠️ 审计 §10 P2 曾指出这里**自称"与 npm run ci 完全一致"却漏跑后三条**：于是
# "许可声明漂了""文档数字过期"在 push/PR 上不会被拦，只有手动打包才暴露。现在补齐。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需要读仓库（默认 token 权限可能更宽）
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 目标平台是 Windows，用同平台 runner 才能复现路径/编码相关行为
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # action 一律 pin 到 commit SHA（审计 §10 P2：`@v4` 是可变标签，标签被移动/仓库被接管时
      # 同一条 workflow 会静默地跑另一份代码）。注释是**人类可读的那份版本号**，
      # 由 dependabot 的 github-actions 条目在 PR 里更新（见 .github/dependabot.yml）。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（tsc + vue-tsc）
        run: npm run typecheck

      - name: 代码风格（ESLint，0 warning 门槛）
        run: npm run lint

      - name: 单元测试（node --test）
        run: npm run test:unit

      - name: 许可声明、文档数字与令牌（与 npm run ci 同一批门禁）
        # 审计 §10 P2：这三条只在 npm run ci / package.yml 里跑过，push/PR 上一直没拦
        run: |
          npm run notices:check
          npm run docs:facts:check
          npm run docs:tokens:check

      - name: 生产构建
        run: npx electron-vite build
        env:
          # 构建不需要联网；显式关掉更新检查相关的干扰
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
