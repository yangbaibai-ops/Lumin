# ─── 打包工件（手动触发，不阻塞 PR）──────────────────────────────────────────
#
# 审计 §9「[P2] 无 CI 产物/发布工件」：CI 只做 typecheck/lint/unit/build，不产安装包。
# 这里补一个 `workflow_dispatch` 的打包 job：产出 `Lumin-<ver>-setup.exe` + SHA256，
# 直接给测试者用（**不需要签名**也能先发；签名缺证书，见 RELEASE.md §0）。
#
# 与 `cdp.yml` 一样刻意**不放在 push/PR 上**：打包要几分钟、还要下载 Electron 产物，
# 每次提交都跑纯属浪费。发版时手动点一下，或由 release 流程调用。
name: Package (manual)

on:
  workflow_dispatch:
    inputs:
      unpack_only:
        description: '只出解包目录（快，用来先确认能起来）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # 同 ci.yml：action 一律 pin 到 commit SHA（注释保留人类可读版本号）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 门禁（类型/风格/单测/文档数字/许可声明）
        run: npm run ci

      - name: 打包
        run: npm run ${{ inputs.unpack_only && 'build:unpack' || 'build:win' }}

      - name: 打包态快速验收（CSP / lumin-file 图片 / asar 懒加载）
        # 审计 §6 P2「打包态代码路径缺乏常驻覆盖」：这套件此前既不在默认矩阵、也没有任何
        # 自动运行入口（ci.yml / cdp.yml 都只取 fast 档）—— 而它守的正是"只有对着产物跑才暴露"
        # 的那一类缺陷（实测抓到过：首屏相对图片在打包态 404、dev 里永远复现不了）。
        # 没有产物时套件自己会如实 SKIP，所以 `unpack_only` 或产物缺失都不会假红。
        run: node tools/run-suites.js --suite=_verify-packaging-fast.js

      - name: 计算 SHA256（把校验和写进 artifact 说明）
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -Include *.exe, *.zip, *.blockmap |
            ForEach-Object { "$($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" } |
            Tee-Object -FilePath dist\SHA256SUMS.txt

      - name: 上传工件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumin-windows-${{ github.run_number }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14
