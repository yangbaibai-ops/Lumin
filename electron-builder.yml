# ─── Lumin 打包配置（**唯一配置真相源**）────────────────────────────────────────
# 解析顺序（读的是 app-builder-lib/out/util/config/load.js，别凭印象猜）：
#   1) 先看 package.json 的 `build` 字段 —— **有它就只用它，本文件整份被忽略**；
#   2) 只有 `build` 字段不存在时，才按 electron-builder.yml → .yaml → .json → .json5 → .toml → .js 找配置文件。
# 所以历史情况正好是反的：之前 package.json 里那三行 `build` 才是真正生效的配置，而本文件（模板默认值
# appId: com.electron.app / productName: lumin / executableName: lumin）一个字都没被读过 —— 是个**死配置地雷**：
# 改它不生效，而一旦有人删掉 package.json 的 `build`，应用身份会瞬间变成 com.electron.app / lumin.exe。
# 现在 package.json 的 `build` 已删除，本文件成为唯一真相源；验收脚本有一条断言盯住「package.json 不许
# 再长出 build 字段」。
#
# 为什么 appId 必须与代码里一致：Windows 的任务栏身份（AppUserModelID）由安装器写进快捷方式，
# 而应用启动时会再设一次（src/main/services/taskbar.ts 的 appId()）。两边不一致时，任务栏右键菜单
# 会出现「名字/图标/点击行为对不上」的怪象。验收脚本 tools/_verify-packaging.js 里有一条断言
# 专门盯住这个一致性。
appId: com.lumin.app
productName: Lumin
copyright: Copyright © 2026 Lumin

directories:
  buildResources: build

# 只排除开发期文件：源码、配置、锁文件、文档、验收脚本、构建日志。out/（编译产物）必须留着 ——
# package.json 的 main 指向 out/main/index.js。
#
# 为什么连文档和日志也要排除：默认打包会把它们一起塞进 app.asar —— 实测解析 asar 顶层能看到
# docs/、tools/、build-out.txt、typecheck-out.txt、dev-run.log。它们跟运行时毫无关系，
# 进来只会让安装包变大、把开发脚本发给用户。运行时没有任何代码读这些路径（已核对 src）。
# 打包排除项（**启动性能**，实测：asar 352MB → 11.5MB，安装包 181MB → ~94MB）：
#   * `tmp/` 是本仓库的**开发期证据目录**（截图、日志、探针脚本、性能 JSON），默认会被
#     打进 asar —— 实测一次就有 160MB+。它不是运行时资源，却会让 Windows Defender 在
#     首次启动时多扫 160MB、安装包白白大一圈。
#   * `tests/` 同理（0.9MB）；根目录的 `*.log` 是构建/测试日志。
#   * `*.md` 一律不进包（运行时没有任何代码读它们）；`*.map` 是调试产物。
# 口径：**只排除开发期文件**，`out/`（编译产物）与 `resources/`（运行时要用的图标等）必须留着。
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!docs/**'
  - '!tools/**'
  - '!tests/**'
  # ─── 渲染层依赖不进包（启动性能：asar 352MB→11.5MB）────────────────────────────
  # 这些包已经被 Vite 打进 out/renderer/**（见 electron.vite.config.ts 的默认拆包），
  # 运行时不会从 node_modules 里 require 它们 —— 随产物分发只会让 asar 变大、让
  # Windows Defender 首次启动多扫几百 MB。主进程真正的运行时依赖（electron-store /
  # electron-updater / iconv-lite / @electron-toolkit/utils 及其传递闭包）不在排除之列。
  - '!node_modules/{mermaid,@mermaid-js,cytoscape,cytoscape-fcose,cytoscape-cose-bilkent,katex,es-toolkit,@tiptap,@codemirror,@lezer,@vue,@babel,@intlify,@floating-ui,@iconify,@upsetjs,@braintree,@chevrotain,@jridgewell,@types,@marijn,@antfu}/**'
  - '!node_modules/{vue,vue-i18n,vue-router,pinia,tiptap-markdown,markdown-it,markdown-it-task-lists,dompurify,d3,d3-*,dagre-d3-es,khroma,stylis,roughjs,points-on-curve,points-on-path,path-data-parser,layout-base,cose-base,robust-predicates,delaunator,internmap,dayjs,marked,linkify-it,linkifyjs,mdurl,uc.micro,entities,uuid,ts-dedent,prosemirror-*,source-map-js,mlly,acorn,magic-string,postcss,commander,chokidar,picomatch,fdir,tinyglobby,readdirp,local-pkg,pkg-types,pathe,ufo,exsolve,confbox,quansync,scule,hookable,birpc,perfect-debounce,fastdom,strictdom,webpack-virtual-modules,muggle-string,ast-kit,ast-walker-scope,unplugin,unplugin-utils,package-manager-detector,tinyexec,nanoid,style-mod,w3c-keyname,crelt,rope-sequence,orderedmap,rw,hachure-fill,punycode.js}/**'
  - '!tmp/**'
  - '!{build-out.txt,typecheck-out.txt,dev-run.log}'
  - '!*.log'
  - '!**/*.log'
  - '!**/*.md'
  - '!**/*.map'

# 保留 asarUnpack：asar 里的文件 Windows shell 读不到，而 resources/ 将来会放导出模板之类的
# **必须作为真实文件存在**的资源。图标现在是嵌进 exe 的（见 win.icon），不依赖这条，
# 但保留它是为了不让后来者踩「资源在 asar 里读不到」这个坑。
asarUnpack:
  - resources/**

win:
  # exe 名 = Lumin.exe（默认取 productName，这里显式写出来，避免改 productName 时悄悄变名）
  executableName: Lumin
  # 图标嵌进 exe 资源：任务栏、Alt+Tab、资源管理器、安装器都用它。必须是 .ico（含多档尺寸），
  # 与开发态用的是同一份设计（resources/icon.ico）。
  # ⚠️ 这里的 ico 必须是**多档 32 位 BGRA DIB**（含 AND 掩码）：用户交付的成品 ico 只有
  # 一个 256×256 的 PNG 压缩条目，GDI+ 的 `Icon.ToBitmap()`（资源管理器取图标同一条路）读不了它
  # （实测抛 Requested range extends past the end of the array → 显示缺省图标）。
  # 换成新图后跑 `node tools/pack-ico.js` 重新打档（由 resources/icon.png 生成，七档 DIB）。
  icon: resources/icon.ico
  # ─── 代码签名（报告 §7.4 A）：**只靠环境变量开关，不改这个文件** ───────────────
  # electron-builder 的自动签名规则（app-builder-lib 的 codeSign 决策，实测口径）：
  #   * 设了 `CSC_LINK`（.pfx 路径或 base64）+ `CSC_KEY_PASSWORD` → **自动签名**；
  #   * 什么都没设 → 产出**未签名**包，控制台给一句 "skipped Windows code signing" 之类的提示。
  # 所以"拿到证书即可签名"这件事已经是一键的：把两个环境变量设上再跑 npm run build:win。
  # Windows 上也可以用 `WIN_CSC_LINK` / `WIN_CSC_KEY_PASSWORD`（同名语义，只作用于 Windows）。
  # 签名后 electron-builder 会把证书的 subject 写进 app-update.yml 的 publisherName，
  # 与下面 win.verifyUpdateCodeSignature 配合 ⇒ 更新包签名不符时**拒绝安装**。
  # 详细步骤与自检：docs/distribution.md（`npm run dist:check` 会打印还缺哪些外部输入）。
  #
  # 更新包必须**带有效签名且发布者与已安装版本一致**才允许安装（报告 §7.4 A 的签名那一半）。
  # ⚠️ 键在 **win** 段（scheme.json 的 WindowsConfiguration.properties），**不在 nsis 段** ——
  # 放到 nsis 段会被 schema 校验直接拒掉整个配置（本轮实测踩过：`configuration.nsis should be null`）。
  # 该键默认值本来就是 true，这里显式写出来是**钉住**它：安全相关的默认值不该在升级
  # electron-builder 时被悄悄改掉。
  verifyUpdateCodeSignature: true
  target:
    - target: nsis
      arch:
        - x64

# ─── 便携版（免安装；数据随身见 src/shared/portable.ts + main/index.ts）──────────
# 单独一个 target，**不进 win.target**：默认 `npm run build:win` 只产出安装包，
# 便携包由 `npm run build:portable` 显式产出（免得每次发版都多一个几十 MB 的产物）。
portable:
  artifactName: Lumin-${version}-portable.${ext}
  # 便携包运行时自解压到临时目录，解包目录名固定成 Lumin 便于复用（不固定则每次都新解一份）
  unpackDirName: Lumin
  # 免安装 ⇒ 不请求提权；需要写系统位置时由用户自己以管理员运行
  requestExecutionLevel: user

nsis:
  # 自定义 NSIS 段（卸载清关联残留、补 InstallLocation）。为什么要这两件事写在 build/installer.nsh 里。
  include: build/installer.nsh
  # 不做一键安装：允许用户选安装目录（写作类应用常被装到非系统盘）
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 当前用户安装（免管理员）。个人项目走 per-user 更省事；要全机安装时改 true 并接受 UAC。
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lumin
  uninstallDisplayName: Lumin
  artifactName: Lumin-${version}-setup.${ext}
  # ─── 图标全链路（用户报障：「桌面图标依旧是 Electron 的图标」）────────────────────
  # win.icon 只决定**被嵌进 Lumin.exe 资源段**的图标（任务栏/Alt+Tab/资源管理器取它）；
  # 安装包**自身**的图标、卸载程序的图标、安装向导页眉图标各走一套独立配置，默认值
  # 是 electron-builder 自带的 electron.ico —— 上一轮只修了 win.icon，于是 exe 图标对了，
  # 安装包/快捷方式却还是 Electron 的脸。三处都必须显式指向同一份 resources/icon.ico。
  #
  # 与 win.icon 同一条硬约束：ico 必须是多档 32 位 BGRA DIB（含 AND 掩码），
  # 由 `node tools/pack-ico.js` 从 resources/icon.png 生成（理由见 win.icon 的注释）。
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  # 装完直接启动：面向普通用户，省一步手动点开
  runAfterFinish: true
  # ⚠️ **绝对不能改成 true**：它会在卸载时删掉 %APPDATA%\Lumin，而用户的笔记索引、草稿、
  # 设置、会话都在那里。卸载程序删用户数据是写作类应用最不可原谅的行为之一。
  deleteAppDataOnUninstall: false

# 文件关联：把 .md / .markdown 登记为「可由 Lumin 打开」。**不抢 .txt**（那是通用文本，
# 抢过来只会惹人烦）。role: Editor 让它在 Windows 的「打开方式」里排到编辑器那一档。
#
# 两个必须知道的真相（写在这里免得后来者误判）：
#  1. **注册 ≠ 成为默认程序**。Windows 10 以后不允许程序静默抢夺默认程序，安装器只能把 Lumin
#     登记为**候选**，用户还得在「设置 → 应用 → 默认应用」里点一次（或在右键「打开方式」里选）。
#  2. 关联要真正能用，**主进程必须会解析裸文件路径参数**（`Lumin.exe D:\a\b.md`）——
#     见 src/main/services/launchIntent.ts。只注册不解析 = 双击了没反应。
#
# description 不进 i18n：Windows 的文件类型名称是**系统级**元数据（不随应用语言切换），
# 所以固定用英文惯例写法。
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown Document
    role: Editor
    icon: resources/doc-md.ico
  - ext: markdown
    name: Markdown
    description: Markdown Document
    role: Editor
    icon: resources/doc-md.ico

# 自动更新：**这里还是占位地址**，所以运行时不会去检查（services/updater.ts 用
# shared/distribution.ts 的同一份占位判据识别并直接跳过，避免用户机器上冒出莫名其妙的网络失败通知）。
# 真正启用需要两步：
#   1) 把 provider/url 换成真实渠道，例如 GitHub Releases：
#        publish:
#          provider: github
#          owner: <你的账号>
#          repo: Lumin
#      或自建静态源（把安装包与 latest.yml 放到任意 HTTPS 静态目录）：
#        publish:
#          provider: generic
#          url: https://你的域名/lumin/updates
#   2) 重新打包（electron-builder 会生成 latest.yml 与 app-update.yml），发布安装包 + latest.yml。
# 之后在设置里打开「自动检查更新」即生效（默认关，不打扰用户）。
# ⚠️ 发布前跑一次 `npm run dist:check -- --release`：它会把"还缺哪些外部输入"列出来，
# 占位地址没换掉时**故意让这一步失败**（免得带着 example.com 发出去）。见 docs/distribution.md。
publish:
  provider: generic
  url: https://example.com/auto-updates

# ─── 非 Windows 平台：目前不是发布目标，配置保留但不做针对性适配 ───────────────
mac:
  entitlementsInherit: build/entitlements.mac.plist
  icon: resources/icon.png
  # 未签名不公证：macOS 上会被 Gatekeeper 拦，故不承诺可用
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: resources/icon.png
  category: Office
  maintainer: Lumin
  target:
    - AppImage
    - deb
appImage:
  artifactName: ${name}-${version}.${ext}

# 依赖是纯 JS（iconv-lite 等），没有需要重编译的原生模块
npmRebuild: false
